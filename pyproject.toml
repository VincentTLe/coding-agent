[project]
name = "coding-agent"
version = "0.1.0"
description = "A from-scratch coding agent built on locally-served Qwen 3.6-27B via vLLM. No frameworks."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tan Le", email = "tle@knox.edu" }
]
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
